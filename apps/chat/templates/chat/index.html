{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Support</title>
  <link rel="stylesheet" href="{% static 'chat/css/style.css' %}">
</head>
<body>

  <section class="auth" id="auth-view" hidden>
    <div class="auth-top">
      <h1>AI Support</h1>
      <select id="ui-language" class="lang-switch" data-i18n-aria-label="label.language"></select>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="login" data-i18n="tab.login"></button>
      <button type="button" class="tab" data-tab="register" data-i18n="tab.register"></button>
    </div>

    <form class="form" id="login-form">
      <div class="field">
        <label for="login-username" data-i18n="label.username"></label>
        <input id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password" data-i18n="label.password"></label>
        <div class="password-field">
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <p class="form-error" id="login-error" role="alert"></p>
      <button type="submit" data-i18n="btn.login"></button>
    </form>

    <form class="form" id="register-form" hidden>
      <div class="field">
        <label for="reg-username" data-i18n="label.username"></label>
        <input id="reg-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="reg-password" data-i18n="label.passwordNew"></label>
        <div class="password-field">
          <input id="reg-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
      </div>
      <div class="field">
        <label for="reg-password-confirm" data-i18n="label.passwordConfirm"></label>
        <div class="password-field">
          <input id="reg-password-confirm" name="password_confirm" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <div class="field">
        <label for="reg-country" data-i18n="label.country"></label>
        <select id="reg-country" name="country" required></select>
      </div>
      <p class="hint" data-i18n="hint.language"></p>
      <p class="form-error" id="register-error" role="alert"></p>
      <button type="submit" data-i18n="btn.register"></button>
    </form>
  </section>

  <div class="shell" id="chat-view" hidden>

    <div class="sidebar" id="sidebar">

      <aside class="rail" id="rail">
        <div class="rail-inner">
          <div class="rail-top">
            <h1 class="brand">
              <span class="brand-short" aria-hidden="true">AI</span>
              <span class="brand-full">AI Support</span>
            </h1>

            <nav class="rail-nav">
              <button type="button" class="rail-item rail-item-help" id="btn-help">
                <span class="rail-icon" data-icon="lifebuoy"></span>
                <span class="rail-label" data-i18n="help.button"></span>
              </button>
              <button type="button" class="rail-item" id="btn-settings-ai">
                <span class="rail-icon" data-icon="sliders"></span>
                <span class="rail-label" data-i18n="settings.ai"></span>
              </button>
              <button type="button" class="rail-item" id="btn-settings-appearance">
                <span class="rail-icon" data-icon="palette"></span>
                <span class="rail-label" data-i18n="settings.appearance"></span>
              </button>
              <button type="button" class="rail-item" id="btn-settings-hotkeys">
                <span class="rail-icon" data-icon="command"></span>
                <span class="rail-label" data-i18n="settings.hotkeys"></span>
              </button>
            </nav>
          </div>

          <div class="rail-bottom">
            <div class="user-zone" id="user-zone">
              <div class="logout-pop">
                <button type="button" class="logout-btn" id="logout">
                  <span data-icon="logout"></span>
                  <span data-i18n="btn.logout"></span>
                </button>
              </div>
              <button type="button" class="rail-item rail-user" id="btn-profile"
                      aria-haspopup="true" aria-expanded="false">
                <span class="avatar" id="avatar" aria-hidden="true"></span>
                <span class="rail-label" id="whoami"></span>
              </button>
            </div>
          </div>
        </div>
      </aside>

      <aside class="chats" id="chats-panel">
        <div class="chats-inner">
          <div class="chats-top">
            <button type="button" class="new-chat-btn" id="new-chat">
              <span data-icon="plus"></span>
              <span data-i18n="btn.newChat"></span>
            </button>
            <button type="button" class="icon-btn" id="chats-collapse" data-icon="chevron-left"
                    data-i18n-title="chats.collapse" data-i18n-aria-label="chats.collapse"></button>
          </div>
          <div class="chats-search">
            <span class="search-icon" data-icon="search"></span>
            <input type="search" id="chats-search" autocomplete="off" data-i18n-placeholder="chats.search">
          </div>
          <p class="form-error chats-error" id="chats-error" role="alert"></p>
          <p class="chats-empty" id="chats-empty" hidden></p>
          <ul class="chats-list" id="chats-list"></ul>
        </div>
      </aside>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <div class="topbar">
        <button type="button" class="icon-btn" id="sidebar-open" data-icon="menu"
                data-i18n-aria-label="btn.menu"></button>
        <button type="button" class="icon-btn" id="chats-expand" data-icon="chevron-right"
                data-i18n-title="chats.expand" data-i18n-aria-label="chats.expand"></button>
        <h2 class="chat-title" id="chat-title"></h2>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="composer-bar">
        <div class="composer">
          <textarea id="input" rows="1" maxlength="4000" data-i18n-placeholder="placeholder.message"></textarea>
          <button type="button" id="send" data-i18n="btn.send"></button>
        </div>
        <p class="disclaimer" data-i18n="disclaimer.text"></p>
        <p class="contact">
          <span data-i18n="contact.text"></span>
          <a id="contact-link"></a>
        </p>
      </div>
    </main>
  </div>

  <dialog id="help-dialog" class="dialog" aria-labelledby="help-title">
    <div class="dialog-body">
      <h2 id="help-title" data-i18n="help.title"></h2>
      <p data-i18n="help.intro"></p>
      <ul class="help-list" id="help-list"></ul>
      <p class="help-fallback" id="help-fallback"></p>
      <div class="dialog-actions">
        <button type="button" id="help-close" data-i18n="btn.close"></button>
      </div>
    </div>
  </dialog>

  <dialog id="notice-dialog" class="dialog" aria-labelledby="notice-title">
    <div class="dialog-body">
      <h2 id="notice-title" data-i18n="notice.title"></h2>
      <p data-i18n="notice.text"></p>
      <div class="dialog-actions">
        <button type="button" id="notice-ok" data-i18n="notice.ok"></button>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@17.0.6/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"></script>

  <script src="{% static 'chat/js/i18n.js' %}"></script>
  <script src="{% static 'chat/js/core.js' %}"></script>
  <script src="{% static 'chat/js/auth.js' %}"></script>
  <script src="{% static 'chat/js/chat.js' %}"></script>
  <script src="{% static 'chat/js/sidebar.js' %}"></script>
  <script src="{% static 'chat/js/main.js' %}"></script>
</body>
</html>
