{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Support</title>
  <link rel="stylesheet" href="{% static 'chat/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'chat/css/accounts.css' %}">
  <script src="{% static 'chat/js/appearance.js' %}"></script>
</head>
<body data-contact-email="{{ contact_email }}">

  <section class="auth" id="auth-view" hidden>
    <div class="auth-top">
      <h1>AI Support</h1>
      <select id="ui-language" class="lang-switch" data-i18n-aria-label="label.language"></select>
    </div>

    <p class="notice-box" id="auth-notice" role="status" hidden></p>

    <div class="tabs" id="auth-tabs">
      <button type="button" class="tab active" data-tab="login" data-i18n="tab.login"></button>
      <button type="button" class="tab" data-tab="register" data-i18n="tab.register"></button>
    </div>

    <form class="form" id="login-form">
      <div class="field">
        <label for="login-id" data-i18n="label.login"></label>
        <input id="login-id" name="login" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password" data-i18n="label.password"></label>
        <div class="password-field">
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <p class="form-error" id="login-error" role="alert"></p>
      <button type="submit" data-i18n="btn.login"></button>
      <button type="button" class="link-button auth-link" id="forgot-link" data-i18n="auth.forgot"></button>
    </form>

    <form class="form" id="register-form" hidden>
      <div class="field">
        <label for="reg-username" data-i18n="label.username"></label>
        <input id="reg-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="reg-email" data-i18n="label.email"></label>
        <input id="reg-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="reg-password" data-i18n="label.passwordNew"></label>
        <div class="password-field">
          <input id="reg-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
      </div>
      <div class="field">
        <label for="reg-password-confirm" data-i18n="label.passwordConfirm"></label>
        <div class="password-field">
          <input id="reg-password-confirm" name="password_confirm" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <div class="field">
        <label for="reg-country" data-i18n="label.country"></label>
        <select id="reg-country" name="country" required></select>
      </div>
      <p class="hint" data-i18n="hint.language"></p>
      <p class="form-error" id="register-error" role="alert"></p>
      <button type="submit" data-i18n="btn.register"></button>
    </form>

    <form class="form" id="forgot-form" hidden>
      <p class="hint" data-i18n="forgot.intro"></p>
      <div class="field">
        <label for="forgot-email" data-i18n="label.email"></label>
        <input id="forgot-email" name="email" type="email" autocomplete="email" required>
      </div>
      <p class="form-error" id="forgot-error" role="alert"></p>
      <button type="submit" data-i18n="btn.sendLink"></button>
      <button type="button" class="link-button auth-link" id="forgot-back" data-i18n="auth.back"></button>
    </form>

    <form class="form" id="reset-form" hidden>
      <p class="hint" data-i18n="reset.intro"></p>
      <div class="field">
        <label for="reset-password" data-i18n="label.passwordNew"></label>
        <div class="password-field">
          <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
      </div>
      <div class="field">
        <label for="reset-password-confirm" data-i18n="label.passwordConfirm"></label>
        <div class="password-field">
          <input id="reset-password-confirm" name="password_confirm" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <p class="form-error" id="reset-error" role="alert"></p>
      <button type="submit" data-i18n="btn.setPassword"></button>
      <button type="button" class="link-button auth-link" id="reset-back" data-i18n="auth.back"></button>
    </form>
  </section>

  <div class="shell" id="chat-view" hidden>

    <div class="sidebar" id="sidebar">

      <aside class="rail" id="rail">
        <div class="rail-inner">
          <div class="rail-top">
            <h1 class="brand">
              <span class="brand-short" aria-hidden="true">AI</span>
              <span class="brand-full">AI Support</span>
            </h1>

            <nav class="rail-nav">
              <button type="button" class="rail-item rail-item-help" id="btn-help">
                <span class="rail-icon" data-icon="lifebuoy"></span>
                <span class="rail-label" data-i18n="help.button"></span>
              </button>
              <button type="button" class="rail-item" id="btn-settings-ai">
                <span class="rail-icon" data-icon="sliders"></span>
                <span class="rail-label" data-i18n="settings.ai"></span>
              </button>
              <button type="button" class="rail-item" id="btn-settings-appearance">
                <span class="rail-icon" data-icon="palette"></span>
                <span class="rail-label" data-i18n="settings.appearance"></span>
              </button>
              <button type="button" class="rail-item" id="btn-settings-hotkeys">
                <span class="rail-icon" data-icon="command"></span>
                <span class="rail-label" data-i18n="settings.hotkeys"></span>
              </button>
            </nav>
          </div>

          <div class="rail-bottom">
            <div class="user-zone" id="user-zone">
              <div class="logout-pop">
                <button type="button" class="logout-btn" id="logout">
                  <span data-icon="logout"></span>
                  <span data-i18n="btn.logout"></span>
                </button>
              </div>
              <button type="button" class="rail-item rail-user" id="btn-profile"
                      aria-haspopup="true" aria-expanded="false">
                <span class="avatar" id="avatar" aria-hidden="true"></span>
                <span class="rail-label" id="whoami"></span>
              </button>
            </div>
          </div>
        </div>
      </aside>

      <aside class="chats" id="chats-panel">
        <div class="chats-inner">
          <div class="chats-top">
            <button type="button" class="new-chat-btn" id="new-chat">
              <span data-icon="plus"></span>
              <span data-i18n="btn.newChat"></span>
            </button>
            <button type="button" class="icon-btn" id="chats-collapse" data-icon="chevron-left"
                    data-i18n-title="chats.collapse" data-i18n-aria-label="chats.collapse"></button>
          </div>
          <div class="chats-search">
            <span class="search-icon" data-icon="search"></span>
            <input type="search" id="chats-search" autocomplete="off" data-i18n-placeholder="chats.search">
          </div>
          <p class="form-error chats-error" id="chats-error" role="alert"></p>
          <p class="chats-empty" id="chats-empty" hidden></p>
          <ul class="chats-list" id="chats-list"></ul>
        </div>
      </aside>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <div class="topbar">
        <button type="button" class="icon-btn" id="sidebar-open" data-icon="menu"
                data-i18n-aria-label="btn.menu"></button>
        <button type="button" class="icon-btn" id="chats-expand" data-icon="chevron-right"
                data-i18n-title="chats.expand" data-i18n-aria-label="chats.expand"></button>
        <h2 class="chat-title" id="chat-title"></h2>
      </div>
      <div class="banner" id="email-banner" hidden>
        <span id="email-banner-text"></span>
        <button type="button" class="link-button" id="email-resend" data-i18n="email.resend"></button>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="composer-bar">
        <div class="composer">
          <textarea id="input" rows="1" maxlength="4000" data-i18n-placeholder="placeholder.message"></textarea>
          <button type="button" id="send" data-i18n="btn.send"></button>
        </div>
        <p class="disclaimer" data-i18n="disclaimer.text"></p>
        <p class="contact" id="contact-line">
          <span data-i18n="contact.text"></span>
          <a id="contact-link"></a>
        </p>
      </div>
    </main>
  </div>

  <dialog id="help-dialog" class="dialog" aria-labelledby="help-title">
    <div class="dialog-body">
      <h2 id="help-title" data-i18n="help.title"></h2>
      <p data-i18n="help.intro"></p>
      <ul class="help-list" id="help-list"></ul>
      <p class="help-fallback" id="help-fallback"></p>
      <div class="dialog-actions">
        <button type="button" id="help-close" data-i18n="btn.close"></button>
      </div>
    </div>
  </dialog>

  <dialog id="notice-dialog" class="dialog" aria-labelledby="notice-title">
    <div class="dialog-body">
      <h2 id="notice-title" data-i18n="notice.title"></h2>
      <p data-i18n="notice.text"></p>
      <div class="dialog-actions">
        <button type="button" id="notice-ok" data-i18n="notice.ok"></button>
      </div>
    </div>
  </dialog>

  <dialog id="settings-dialog" class="dialog settings-dialog" aria-labelledby="settings-title">
    <div class="settings-shell">

      <aside class="settings-nav">
        <h2 id="settings-title" data-i18n="settings.title"></h2>
        <div class="settings-search">
          <span class="search-icon" data-icon="search"></span>
          <input type="search" id="settings-search" autocomplete="off" data-i18n-placeholder="settings.search">
        </div>
        <nav class="settings-tabs" data-i18n-aria-label="settings.sections">
          <button type="button" class="settings-tab active" data-section="appearance">
            <span data-icon="palette"></span><span data-i18n="settings.appearance"></span>
          </button>
          <button type="button" class="settings-tab" data-section="ai">
            <span data-icon="sliders"></span><span data-i18n="settings.ai"></span>
          </button>
          <button type="button" class="settings-tab" data-section="profile">
            <span data-icon="user"></span><span data-i18n="settings.profile"></span>
          </button>
          <button type="button" class="settings-tab" data-section="hotkeys">
            <span data-icon="command"></span><span data-i18n="settings.hotkeys"></span>
          </button>
        </nav>
      </aside>

      <section class="settings-content">
        <div class="settings-topbar">
          <span id="settings-status" role="status" aria-live="polite"></span>
          <button type="button" class="icon-btn" id="settings-close" data-icon="x"
                  data-i18n-aria-label="btn.close"></button>
        </div>

        <div class="settings-results" id="settings-results" hidden></div>

        <div class="settings-panel" data-section="appearance">
          <h3 data-i18n="settings.appearance"></h3>

          <div class="setting" data-setting="theme">
            <fieldset class="choices">
              <legend data-i18n="theme.label"></legend>
              <div class="choice-list">
                <label class="choice"><input type="radio" name="theme" value="light"><span data-i18n="theme.light"></span></label>
                <label class="choice"><input type="radio" name="theme" value="dark"><span data-i18n="theme.dark"></span></label>
                <label class="choice"><input type="radio" name="theme" value="auto"><span data-i18n="theme.auto"></span></label>
              </div>
            </fieldset>
          </div>

          <div class="setting" data-setting="colors">
            <h4 data-i18n="colors.title"></h4>
            <div class="color-row">
              <label for="color-user" data-i18n="colors.user"></label>
              <input type="color" id="color-user" data-color="user_bubble">
              <span class="default-tag" data-for="user_bubble" data-i18n="colors.default"></span>
              <button type="button" class="link-button" data-reset="user_bubble" data-i18n="colors.reset"></button>
            </div>
            <div class="color-row">
              <label for="color-bot" data-i18n="colors.bot"></label>
              <input type="color" id="color-bot" data-color="bot_bubble">
              <span class="default-tag" data-for="bot_bubble" data-i18n="colors.default"></span>
              <button type="button" class="link-button" data-reset="bot_bubble" data-i18n="colors.reset"></button>
            </div>
            <p class="hint" data-i18n="colors.crisisNote"></p>
          </div>

          <div class="setting" data-setting="font-size">
            <fieldset class="choices">
              <legend data-i18n="font.size"></legend>
              <div class="choice-list">
                <label class="choice"><input type="radio" name="font_size" value="small"><span data-i18n="size.small"></span></label>
                <label class="choice"><input type="radio" name="font_size" value="medium"><span data-i18n="size.medium"></span></label>
                <label class="choice"><input type="radio" name="font_size" value="large"><span data-i18n="size.large"></span></label>
                <label class="choice"><input type="radio" name="font_size" value="xlarge"><span data-i18n="size.xlarge"></span></label>
              </div>
            </fieldset>
          </div>

          <div class="setting" data-setting="font-family">
            <fieldset class="choices">
              <legend data-i18n="font.family"></legend>
              <div class="choice-list">
                <label class="choice"><input type="radio" name="font_family" value="system"><span data-i18n="font.system"></span></label>
                <label class="choice" data-font-sample="serif"><input type="radio" name="font_family" value="serif"><span data-i18n="font.serif"></span></label>
                <label class="choice" data-font-sample="mono"><input type="radio" name="font_family" value="mono"><span data-i18n="font.mono"></span></label>
                <label class="choice" data-font-sample="readable"><input type="radio" name="font_family" value="readable"><span data-i18n="font.readable"></span></label>
              </div>
            </fieldset>
          </div>

          <div class="settings-preview" aria-hidden="true">
            <div class="message message-user" data-i18n="preview.user"></div>
            <div class="message message-bot"><div class="message-content" data-i18n="preview.bot"></div></div>
            <div class="message message-bot message-crisis"><div class="message-content" data-i18n="preview.crisis"></div></div>
          </div>

          <button type="button" class="secondary-btn" id="settings-reset" data-i18n="settings.reset"></button>
        </div>

        <div class="settings-panel" data-section="ai" hidden>
          <h3 data-i18n="settings.ai"></h3>

          <div class="setting" data-setting="ai-preset">
            <fieldset class="choices">
              <legend data-i18n="ai.preset"></legend>
              <div class="choice-list">
                <label class="choice"><input type="radio" name="ai_preset" data-ai="preset" value="balanced"><span data-i18n="ai.preset.balanced"></span></label>
                <label class="choice"><input type="radio" name="ai_preset" data-ai="preset" value="gentle"><span data-i18n="ai.preset.gentle"></span></label>
                <label class="choice"><input type="radio" name="ai_preset" data-ai="preset" value="calm"><span data-i18n="ai.preset.calm"></span></label>
                <label class="choice"><input type="radio" name="ai_preset" data-ai="preset" value="direct"><span data-i18n="ai.preset.direct"></span></label>
                <label class="choice"><input type="radio" name="ai_preset" data-ai="preset" value="upbeat"><span data-i18n="ai.preset.upbeat"></span></label>
                <label class="choice"><input type="radio" name="ai_preset" data-ai="preset" value="custom"><span data-i18n="ai.preset.custom"></span></label>
              </div>
            </fieldset>
          </div>

          <div class="setting" data-setting="ai-sliders">
            <h4 data-i18n="ai.custom"></h4>
            <div class="slider-row">
              <label for="ai-warmth" data-i18n="ai.warmth"></label>
              <input type="range" id="ai-warmth" data-ai="warmth" min="1" max="5" step="1">
              <output id="ai-warmth-value" for="ai-warmth"></output>
            </div>
            <div class="slider-row">
              <label for="ai-enthusiasm" data-i18n="ai.enthusiasm"></label>
              <input type="range" id="ai-enthusiasm" data-ai="enthusiasm" min="1" max="5" step="1">
              <output id="ai-enthusiasm-value" for="ai-enthusiasm"></output>
            </div>
          </div>

          <div class="setting" data-setting="ai-emoji">
            <fieldset class="choices">
              <legend data-i18n="ai.emoji"></legend>
              <div class="choice-list">
                <label class="choice"><input type="radio" name="ai_emoji" data-ai="emoji" value="off"><span data-i18n="ai.emoji.off"></span></label>
                <label class="choice"><input type="radio" name="ai_emoji" data-ai="emoji" value="rare"><span data-i18n="ai.emoji.rare"></span></label>
                <label class="choice"><input type="radio" name="ai_emoji" data-ai="emoji" value="often"><span data-i18n="ai.emoji.often"></span></label>
              </div>
            </fieldset>
          </div>

          <p class="hint" data-i18n="ai.note"></p>
          <p class="hint" data-i18n="ai.crisisNote"></p>
          <button type="button" class="secondary-btn" id="ai-reset" data-i18n="ai.reset"></button>
        </div>

        <div class="settings-panel" data-section="profile" hidden>
          <h3 data-i18n="settings.profile"></h3>

          <div class="setting" data-setting="account">
            <h4 data-i18n="profile.account"></h4>
            <div class="info-row">
              <span class="info-label" data-i18n="label.username"></span>
              <span id="profile-username"></span>
            </div>
            <div class="info-row">
              <span class="info-label" data-i18n="label.email"></span>
              <span id="profile-email"></span>
            </div>
            <div class="info-row">
              <span class="info-label"></span>
              <span class="status-tag" id="profile-email-status" hidden></span>
              <button type="button" class="link-button" id="profile-resend" data-i18n="email.resend" hidden></button>
            </div>
          </div>

          <div class="setting" data-setting="locale">
            <h4 data-i18n="profile.locale"></h4>
            <div class="field">
              <label for="profile-country" data-i18n="label.country"></label>
              <select id="profile-country"></select>
            </div>
            <div class="field">
              <label for="profile-language" data-i18n="label.language"></label>
              <select id="profile-language"></select>
            </div>
            <p class="hint" data-i18n="profile.locale.note"></p>
          </div>

          <div class="setting" data-setting="email-change">
            <h4 data-i18n="profile.emailChange"></h4>
            <form class="form" id="email-form">
              <div class="field">
                <label for="email-new" data-i18n="label.newEmail"></label>
                <input id="email-new" name="email" type="email" autocomplete="email" required>
              </div>
              <div class="field">
                <label for="email-password" data-i18n="label.currentPassword"></label>
                <div class="password-field">
                  <input id="email-password" name="current_password" type="password" autocomplete="current-password" required>
                </div>
              </div>
              <p class="hint" data-i18n="profile.emailChange.note"></p>
              <p class="form-error" id="email-form-error" role="alert"></p>
              <p class="form-ok" id="email-form-ok" role="status"></p>
              <button type="submit" class="secondary-btn" data-i18n="btn.save"></button>
            </form>
          </div>

          <div class="setting" data-setting="password-change">
            <h4 data-i18n="profile.password"></h4>
            <form class="form" id="password-form">
              <div class="field">
                <label for="password-current" data-i18n="label.currentPassword"></label>
                <div class="password-field">
                  <input id="password-current" name="current_password" type="password" autocomplete="current-password" required>
                </div>
              </div>
              <div class="field">
                <label for="password-new" data-i18n="label.passwordNew"></label>
                <div class="password-field">
                  <input id="password-new" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
              </div>
              <div class="field">
                <label for="password-new-confirm" data-i18n="label.passwordConfirm"></label>
                <div class="password-field">
                  <input id="password-new-confirm" name="new_password_confirm" type="password" autocomplete="new-password" required>
                </div>
              </div>
              <p class="hint" data-i18n="profile.password.note"></p>
              <p class="form-error" id="password-form-error" role="alert"></p>
              <p class="form-ok" id="password-form-ok" role="status"></p>
              <button type="submit" class="secondary-btn" data-i18n="btn.save"></button>
            </form>
          </div>

          <div class="setting" data-setting="data">
            <h4 data-i18n="profile.exportTitle"></h4>
            <p class="hint" data-i18n="profile.exportHelp"></p>
            <p class="form-error" id="export-error" role="alert"></p>
            <div class="button-row">
              <button type="button" class="secondary-btn" id="export-readable-btn" data-i18n="profile.exportReadable"></button>
              <button type="button" class="secondary-btn" id="export-btn" data-i18n="profile.exportJson"></button>
            </div>
          </div>

          <div class="setting" data-setting="import">
            <h4 data-i18n="profile.importTitle"></h4>
            <p class="hint" data-i18n="profile.import.note"></p>
            <p class="form-error" id="import-error" role="alert"></p>
            <p class="form-ok" id="import-ok" role="status"></p>
            <button type="button" class="secondary-btn" id="import-btn" data-i18n="profile.import"></button>
            <input type="file" id="import-input" accept=".json,application/json" hidden>
          </div>

          <div class="setting" data-setting="danger">
            <h4 data-i18n="profile.danger"></h4>
            <div class="button-row">
              <button type="button" class="secondary-btn" id="settings-logout" data-i18n="btn.logout"></button>
              <button type="button" class="secondary-btn" id="logout-all" data-i18n="btn.logoutAll"></button>
              <button type="button" class="danger-btn" id="delete-account-btn" data-i18n="btn.deleteAccount"></button>
            </div>
          </div>
        </div>

        <div class="settings-panel" data-section="hotkeys" hidden>
          <h3 data-i18n="settings.hotkeys"></h3>
          <p class="settings-soon" data-i18n="settings.soon"></p>
        </div>
      </section>
    </div>
  </dialog>

  <dialog id="delete-dialog" class="dialog" aria-labelledby="delete-title">
    <form class="dialog-body form" id="delete-form">
      <h2 id="delete-title" data-i18n="delete.title"></h2>
      <p data-i18n="delete.text"></p>
      <div class="field">
        <label for="delete-password" data-i18n="label.currentPassword"></label>
        <div class="password-field">
          <input id="delete-password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <p class="form-error" id="delete-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="secondary-btn" id="delete-cancel" data-i18n="btn.cancel"></button>
        <button type="submit" class="danger-btn" data-i18n="btn.deleteForever"></button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@17.0.6/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"></script>
